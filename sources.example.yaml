# X to MD settings — copy to sources.yaml and edit.
#
# WHAT YOU FOLLOW does not live here: it lives in sources/x.md (copy
# sources.example/ to get started) — one handle per line.

# X is fetched via one of two paid, hosted backends — no X account, no
# login, no self-hosting either way:
#
# twitterapi.io (https://twitterapi.io, the default) — pay-per-tweet, no
# subscription: $0.15 per 1,000 tweets *returned*, so set
# fetch.max_per_source to a number you are happy to pay for (see below).
#
# tweetapi.com (https://tweetapi.com) — flat monthly request quota instead
# (e.g. $17/mo for 100,000 calls on the Pro tier; ~20 tweets/call).
x:
  backend: twitterapi     # twitterapi | tweetapi
  api_key: ""             # twitterapi.io key — or set XMD_TWITTERAPI_KEY
  tweetapi_api_key: ""    # tweetapi.com key — or set XMD_TWEETAPI_KEY (only
                          # needed when backend: tweetapi)
  tweetapi_rate_limit_per_minute: 60  # tweetapi.com's request cap (only
                          # applies when backend: tweetapi) — paces requests
                          # so concurrent sources don't trip 429s; free tier
                          # is 10/min as of writing, raise to 60 once you're
                          # on the paid plan

fetch:
  max_per_source: 15     # tweets fetched per handle per fetch: up to twice this
                         # (the spare half is room for the replies and retweets
                         # the filters drop), and whatever the filters leave is
                         # kept. 0 = no limit on tweetapi.com, where
                         # max_age_hours ends the paging; on twitterapi.io,
                         # which bills per tweet, 0 keeps a safety ceiling of
                         # 100 per handle, and a warning names any handle that
                         # reaches it
  max_age_hours: 48      # stop paginating a handle once a tweet older than
                         # this is seen (0 = unlimited); also bounds cost

filters:
  drop_retweets: false   # include retweets (shown with a 🔁 line quoting
                         # the original) — set true to exclude them
  drop_replies: true     # exclude replies (thread continuations to your own
                         # tweets are always kept regardless)
  block_keywords: []     # drop tweets whose text contains any of these
                         # (case-insensitive), e.g. ["#ad", "giveaway"]

digest:
  snippet_chars: 140     # quick digest (`xmd digest --quick`): length of a regular post's one-liner
  retweet_chars: 100     # ... of a plain retweet's one-liner
  media_chars: 500       # ... cap on image tweets, which are kept nearly whole
  trending_similarity: 0.4  # 0-1: how alike two posts must be to count as the
                         # same story in the Trending block (0.6 = near-verbatim
                         # reposts only, 0.3 = looser, more false matches)

sources_dir: sources     # where sources/x.md lives
storage: xmd.db          # local SQLite dedupe store (created automatically)
digest_dir: digests      # where rendered .md files are written
